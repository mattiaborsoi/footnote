name: qa

# Independent QA by an Opus agent: it runs the project, it does not read it for style.
# It can run Docker and curl and post one report; it cannot edit or push.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  qa:
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            You are the independent QA engineer for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            You did not write this code. Your job is to run it and report, not to review style.

            1. Read CLAUDE.md, section "Run and test", and the PR body's "Tested:" line.
            2. Build the dev image: `docker build --target dev -t footnote-dev .`
            3. Run inside it, bind-mounting the checkout and masking node_modules and .next
               (`docker run --rm -v "$PWD":/app -v /app/node_modules -v /app/.next footnote-dev <command>`):
               `pnpm lint`, `sh -c "pnpm exec next typegen && pnpm exec tsc --noEmit"`, `pnpm build`, and `pnpm test` if package.json has a test script.
            4. If tests/e2e exists, run it as CLAUDE.md describes.
            5. Reproduce what the PR body claims was tested wherever a command can: for example start the app
               (`docker run -d -p 3000:3000 ... pnpm dev --hostname 0.0.0.0`), wait for it, then curl the routes it touches.
            6. Post exactly one comment with `gh pr comment ${{ github.event.pull_request.number }} --body "..."` titled **QA report**:
               a table of each check with PASS or FAIL and the exact command, then failure output trimmed to the relevant lines,
               then a one-line verdict. Never include secrets or environment values. Be terse.
            Do not modify files, do not push.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(docker:*),Bash(curl:*),Bash(ls:*),Bash(cat:*),Bash(sleep:*),Bash(timeout:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
