name: footnote

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3002:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://footnote:${POSTGRES_PASSWORD}@db:5432/footnote
      SMTP_HOST: mail
      SMTP_PORT: "1025"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: footnote
      POSTGRES_DB: footnote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footnote -d footnote"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Catches every outgoing email (magic links) in development. UI on :8025.
  mail:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  db-data:
