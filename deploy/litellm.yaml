# The bulkhead: the only place the provider key lives. The app talks to this with its own key,
# generated once with a monthly budget and a rate limit (see scripts/bootstrap-droplet.sh).
model_list:
  - model_name: haiku
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: opus
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  request_timeout: 120
